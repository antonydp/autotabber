# ============================================================
#  Autotabber — stack Docker / Portainer (build ibrida)
#  Link brano  ->  chitarra tab suonabile (Demucs + Basic Pitch + alphaTab)
#  Il download passa da istanze Cobalt comunitarie: il server non
#  parla mai con YouTube diretto (niente cookie/PO-token).
#
#  Ogni servizio ha SIA image: (ghcr.io) SIA build: — quindi:
#   - Portainer -> Stacks -> Add stack -> Repository
#       Repository URL: https://github.com/antonydp/autotabber
#       Compose path  : docker-compose.yml
#     (Portainer clona e costruisce le immagini dal sorgente)
#   - CLI:  docker compose up -d --build
#   - Se le immagini GHCR sono già disponibili (vedi README),
#     il pull viene usato al posto della build.
#
#  Le chiavi Modal NON vanno mai scritte qui: usale come
#  variabili d'ambiente nello stack Portainer o in un file .env
#  accanto al compose (mai committato, vedi .gitignore).
# ============================================================

services:

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    image: ghcr.io/antonydp/autotabber-api:latest
    build: ./api
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  # (nessun servizio bgutil: il download passa da Cobalt self-hosted)

  # Sessione YouTube (PO token + visitor_data) generata in casa:
  # chromium con browser automation, token rinnovato in automatico.
  yt-session-generator:
    image: ghcr.io/imputnet/yt-session-generator:webserver
    pull_policy: always
    init: true
    restart: unless-stopped

  # Istanza Cobalt PRIVATA: e' lei che parla con YouTube (con la sessione
  # generata qui accanto). Rete interna: nessuna porta pubblicata.
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    pull_policy: always
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      # URL interna: i tunnel URL generati resteranno raggiungibili
      # solo dalla rete docker (va bene, il worker e' qui dentro)
      API_URL: "http://cobalt:9000/"
      YOUTUBE_SESSION_SERVER: "http://yt-session-generator:8080"
      # Per i video tosti (age-restricted ecc.): metti il tuo cookies.json
      # nel volume (docker cp <file> <volume-app-data>:/cobalt-cookies.json)
      # e decommenta COOKIE_PATH + volumes. Formato: {"youtube": ["NOMEC=val; ..."]}
      # COOKIE_PATH: "/data/cobalt-cookies.json"
    # volumes:
    #   - app-data:/data

  worker:
    image: ghcr.io/antonydp/autotabber-worker:latest
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      DEMUCS_ENABLED: ${DEMUCS_ENABLED:-1}
      DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs_6s}
      KEEP_AUDIO: ${KEEP_AUDIO:-0}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-900}
      # di default usa la TUA istanza cobalt interna; il fetcher prova
      # comunque le liste pubbliche come riserva
      COBALT_API_URLS: ${COBALT_API_URLS:-http://cobalt:9000}
      DOWNLOAD_MAX_MB: ${DOWNLOAD_MAX_MB:-300}
      MODAL_ENABLED: ${MODAL_ENABLED:-0}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      MODAL_APP: ${MODAL_APP:-autotabber}
      MODAL_FN: ${MODAL_FN:-transcribe}
      TORCH_HOME: /data/torch-cache
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
      cobalt:
        condition: service_started
    restart: unless-stopped

  web:
    image: ghcr.io/antonydp/autotabber-web:latest
    build: ./web
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  app-data:
