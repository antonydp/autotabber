# ============================================================
#  Autotabber — stack Portainer "solo immagini" (web editor)
#
#  Download via istanze Cobalt comunitarie: il server non parla mai
#  con YouTube diretto (niente cookie, PO-token o bgutil).
#  Usalo quando le immagini GHCR sono già pubblicate dal workflow
#  GitHub Actions (attivato in .github/workflows/docker.yml):
#    ghcr.io/antonydp/autotabber-{api,worker,web}:latest
#
#  Deploy su Portainer:
#    Stacks -> Add stack -> Web editor -> incolla questo file
#    e aggiungi le variabili d'ambiente nella sezione
#    "Environment variables" (MAI le chiavi dentro questo file!).
#
#  Deploy alternativo SENZA CI (Portainer clona e costruisce):
#    Stacks -> Add stack -> Repository -> docker-compose.yml
#
#  Suggerimento: se attivi Modal (MODAL_ENABLED=1), Demucs gira
#  dentro Modal: imposta anche DEMUCS_ENABLED=0 per evitare la
#  separazione doppia (locale + remota).
# ============================================================

services:

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    image: ghcr.io/antonydp/autotabber-api:latest
    pull_policy: always
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  # (la sessione YouTube per cobalt e' il servizio yt-session qui sotto)

  # Sessione YouTube (PO token) via bgutil provider: BotGuard gira in una
  # JS VM dentro Node, niente chromium. Il tag 1.3.2 e' FISSATO di proposito:
  # da 2.0.0 il server esige Content-Type application/json su /get_pot,
  # ma cobalt manda il POST senza header -> 415 -> sessione mai caricata.
  yt-session:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    pull_policy: always
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  # Istanza Cobalt PRIVATA: e' lei che parla con YouTube (con la sessione
  # generata qui accanto). Rete interna: nessuna porta pubblicata.
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    pull_policy: always
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      # URL interna: i tunnel URL generati resteranno raggiungibili
      # solo dalla rete docker (va bene, il worker e' qui dentro)
      API_URL: "http://cobalt:9000/"
      # cobalt fa POST <questo URL>/get_pot: protocollo bgutil
      YOUTUBE_SESSION_SERVER: "http://yt-session:4416"
      # Per i video tosti (age-restricted ecc.): metti il tuo cookies.json
      # nel volume (docker cp <file> <volume-app-data>:/cobalt-cookies.json)
      # e decommenta COOKIE_PATH + volumes. Formato: {"youtube": ["NOMEC=val; ..."]}
      # COOKIE_PATH: "/data/cobalt-cookies.json"
    # volumes:
    #   - app-data:/data
    depends_on:
      yt-session:
        condition: service_healthy

  worker:
    image: ghcr.io/antonydp/autotabber-worker:latest
    pull_policy: always
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      DEMUCS_ENABLED: ${DEMUCS_ENABLED:-1}
      DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs_6s}
      KEEP_AUDIO: ${KEEP_AUDIO:-0}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-900}
      # di default usa la TUA istanza cobalt interna; il fetcher prova
      # comunque le liste pubbliche come riserva
      COBALT_API_URLS: ${COBALT_API_URLS:-http://cobalt:9000}
      DOWNLOAD_MAX_MB: ${DOWNLOAD_MAX_MB:-300}
      MODAL_ENABLED: ${MODAL_ENABLED:-0}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      MODAL_APP: ${MODAL_APP:-autotabber}
      MODAL_FN: ${MODAL_FN:-transcribe}
      TORCH_HOME: /data/torch-cache
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
      cobalt:
        condition: service_started
    restart: unless-stopped

  web:
    image: ghcr.io/antonydp/autotabber-web:latest
    pull_policy: always
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  app-data:
